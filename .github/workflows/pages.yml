# Publishes the website (front end only) to GitHub Pages.
# The pages talk to the Fieldbook server on your NAS, where the real-time database lives.
#
# One-time setup in the GitHub repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables → New variable:
#       FIELDBOOK_API_URL = https://fieldbook-api.example.com   (the NAS address through Cloudflare Tunnel)
name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/build-pages.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the server address is set
        run: |
          if [ -z "${{ vars.FIELDBOOK_API_URL }}" ]; then
            echo "::error::Set the repository variable FIELDBOOK_API_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
      - run: sh scripts/fetch-pdfjs.sh "$RUNNER_TEMP/pdfjs"
      - run: node scripts/build-pages.mjs --api "${{ vars.FIELDBOOK_API_URL }}" --out _site --pdfjs "$RUNNER_TEMP/pdfjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
