<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--fieldbook:csp-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fieldbook — Project Tracker</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="static/fieldbook.css">
<script src="static/config.js"></script>
<script src="static/client.js"></script>
<script src="static/runtime.js"></script>
</head>
<body>
<header id="mtop"></header>
<div id="app">
  <nav id="rail" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<nav id="tabbar" aria-label="Main"></nav>
<div class="pop" id="pop"></div>
<div class="overlay" id="moreOverlay"><div class="modal more-sheet" id="moreBody" role="dialog" aria-label="More sections"></div></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="overlay" id="lightboxOverlay"><div class="lightbox" id="lightboxBody"></div></div>
<div class="overlay" id="pdfViewerOverlay"><div class="pdf-viewer" id="pdfViewerBody"></div></div>
<div class="overlay" id="shareOverlay"><div class="modal share-sheet" id="shareBody"></div></div>
<div class="overlay" id="annotateOverlay"><div class="annot" id="annotateBody"></div></div>
<div class="overlay" id="compareOverlay"><div class="cmp" id="compareBody"></div></div>
<div class="overlay" id="reportOverlay"><div class="report-wrap" id="reportBody"></div></div>
<script src="static/fieldbook.js"></script>
</body>
</html>
